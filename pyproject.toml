[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lean2graph"
version = "0.1.0"
description = "Deterministic Lean 4 proof graph extractor"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "pydantic>=2",
  "networkx>=3",
  "jsonschema>=4",
  "PyYAML>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
lean2graph = "lean2graph.cli:app"

[tool.setuptools.packages.find]
include = ["lean2graph*"]

[tool.setuptools.package-data]
lean2graph = ["config/*.yaml", "schemas/*.v2.json"]
